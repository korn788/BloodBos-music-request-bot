# Builds the installers for Windows, macOS and Linux, tests every one of them,
# and — when a version tag like v1.2.0 is pushed — publishes a GitHub Release.
# Every change on main also refreshes the "Test build" pre-release (tag
# `testing`): the same downloads, from the newest code, to try before a release.
#
# To make a release:  bump src/version.py, commit, then
#     git tag v1.2.0 && git push origin v1.2.0
#
# Optional "built-in Kick app" (one-click Kick sign-in for everyone):
#   Settings > Secrets and variables > Actions
#     Variables: KICK_CLIENT_ID      Secrets: KICK_CLIENT_SECRET
#   (and optionally variables TWITCH_CLIENT_ID / *_REDIRECT_URI)

name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]     # a release published on github.com also builds + attaches the installers

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PY: "3.12"

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PY }}" }
      - name: System packages (VLC, Qt libraries)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends vlc-bin vlc-plugin-base libvlc5 \
            libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
      - run: python src/main.py --selftest

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PY }}" }
      - run: pip install -r requirements.txt pyinstaller
      - name: Build keys
        env:
          KICK_CLIENT_ID: ${{ vars.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          KICK_REDIRECT_URI: ${{ vars.KICK_REDIRECT_URI }}
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
          TWITCH_REDIRECT_URI: ${{ vars.TWITCH_REDIRECT_URI }}
        run: python packaging/write_build_keys.py
      - run: python packaging/fetch_vlc.py windows vendor/vlc
      - run: pyinstaller packaging/bloodbos_radio.spec --noconfirm
      - name: Add VLC
        shell: pwsh
        run: Copy-Item -Recurse -Force vendor/vlc "dist/BLOODBOS Radio/vlc"
      - name: Self-test the built app
        shell: pwsh
        run: |
          $env:BLOODBOS_SELFTEST_LOG = "$env:RUNNER_TEMP\selftest.log"
          $p = Start-Process -FilePath "dist\BLOODBOS Radio\BLOODBOS Radio.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path $env:BLOODBOS_SELFTEST_LOG) { Get-Content $env:BLOODBOS_SELFTEST_LOG }
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      - name: Make the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = (python -c "import sys; sys.path.insert(0,'src'); from version import __version__; print(__version__)").Trim()
          & $iscc "/DAppVersion=$v" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Test the installer (silent install + self-test)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\BLOODBOS-Radio-Setup-Windows.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer failed ($($p.ExitCode))" }
          $exe = "$env:LOCALAPPDATA\Programs\BLOODBOS Radio\BLOODBOS Radio.exe"
          if (-not (Test-Path $exe)) { throw "app not installed at $exe" }
          $env:BLOODBOS_SELFTEST_LOG = "$env:RUNNER_TEMP\selftest2.log"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content $env:BLOODBOS_SELFTEST_LOG
          if ($p.ExitCode -ne 0) { throw "installed app self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/BLOODBOS-Radio-Setup-Windows.exe
          if-no-files-found: error

  macos:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, optional: false }        # Apple Silicon
          - { runner: macos-15-intel, optional: true }   # Intel Macs
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PY }}" }
      - run: pip install -r requirements.txt pyinstaller
      - name: Build keys
        env:
          KICK_CLIENT_ID: ${{ vars.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          KICK_REDIRECT_URI: ${{ vars.KICK_REDIRECT_URI }}
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
          TWITCH_REDIRECT_URI: ${{ vars.TWITCH_REDIRECT_URI }}
        run: python packaging/write_build_keys.py
      - run: python packaging/fetch_vlc.py macos vendor/vlc
      - run: pyinstaller packaging/bloodbos_radio.spec --noconfirm
      - name: Finish the app and make the .dmg
        run: |
          label=$( [ "$(uname -m)" = "arm64" ] && echo AppleSilicon || echo Intel )
          echo "LABEL=$label" >> "$GITHUB_ENV"
          for i in 1 2 3; do
            bash packaging/macos/make_dmg.sh "dist/BLOODBOS Radio.app" vendor/vlc "dist/BLOODBOS-Radio-macOS-$label.dmg" && break
            sleep 10
          done
          test -f "dist/BLOODBOS-Radio-macOS-$label.dmg"
      - name: Self-test the built app
        run: '"dist/BLOODBOS Radio.app/Contents/MacOS/BLOODBOS Radio" --selftest'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ env.LABEL }}
          path: dist/BLOODBOS-Radio-macOS-*.dmg
          if-no-files-found: error

  linux:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PY }}" }
      - name: System packages
        # (VLC's video plugins, vlc-cache-gen, patchelf and the libxcb-* list
        # are for the AppImage, which packs them.)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends vlc-bin vlc-plugin-base libvlc5 \
            vlc-plugin-video-output libvlc-bin patchelf \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pyinstaller
      - name: Build keys
        env:
          KICK_CLIENT_ID: ${{ vars.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          KICK_REDIRECT_URI: ${{ vars.KICK_REDIRECT_URI }}
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
          TWITCH_REDIRECT_URI: ${{ vars.TWITCH_REDIRECT_URI }}
        run: python packaging/write_build_keys.py
      - run: pyinstaller packaging/bloodbos_radio.spec --noconfirm
      - run: dist/bloodbos-radio/bloodbos-radio --selftest
      - name: Make the .deb
        run: |
          v=$(python -c "import sys; sys.path.insert(0,'src'); from version import __version__; print(__version__)")
          bash packaging/linux/build_deb.sh dist/bloodbos-radio "$v" dist/bloodbos-radio_amd64.deb
      - name: Test the .deb (install + self-test)
        run: |
          sudo apt-get install -y -q ./dist/bloodbos-radio_amd64.deb
          bloodbos-radio --selftest
      - name: Make the ready-made app download (what install.sh installs)
        run: tar -C dist -czf dist/BLOODBOS-Radio-Linux-x86_64.tar.gz bloodbos-radio
      - name: Make the AppImage (one file, VLC inside, no terminal needed)
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          python3 packaging/linux/make_appimage.py dist/bloodbos-radio \
            dist/BLOODBOS-Radio-x86_64.AppImage --appimagetool ./appimagetool
      - name: Self-test the AppImage (its own VLC, streaming over https)
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          BLOODBOS_VLC_ARGS: --aout=dummy
          BLOODBOS_SELFTEST_MEDIA: >-
            https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tests/media/sample.mp4
            https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tests/media/sample.webm
        run: |
          dist/BLOODBOS-Radio-x86_64.AppImage --selftest | tee appimage-selftest.log
          grep -q "(bundled)" appimage-selftest.log
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/bloodbos-radio_amd64.deb
            dist/BLOODBOS-Radio-Linux-x86_64.tar.gz
            dist/BLOODBOS-Radio-x86_64.AppImage
          if-no-files-found: error

  linux_installer:
    needs: [tests, linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "fedora:latest", "archlinux:latest"]
        mode: [ready-made, source]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Refresh the package lists (fresh container)
        run: |
          if command -v pacman >/dev/null; then pacman -Syu --noconfirm; fi
          if command -v apt-get >/dev/null; then apt-get update -q; fi
      - uses: actions/download-artifact@v4
        if: matrix.mode == 'ready-made'
        with: { name: linux, path: artifacts }
      - name: Run install.sh (ready-made app)
        if: matrix.mode == 'ready-made'
        run: |
          bash install.sh --bundle artifacts/BLOODBOS-Radio-Linux-x86_64.tar.gz --yes --no-launch
          grep -q "bloodbos-radio-app/app/bloodbos-radio" $HOME/.local/bin/bloodbos-radio
      - name: Run install.sh (from source)
        if: matrix.mode == 'source'
        run: bash install.sh --from . --yes --no-launch
      - name: Self-test the installed app
        run: $HOME/.local/bin/bloodbos-radio --selftest

  appimage:
    # The AppImage on other Linuxes, with NO VLC installed — only the basic
    # libraries every desktop has (packaging/linux/appimage-excludelist.txt).
    # 1. nothing else it needs may be missing  2. the self-test passes, using
    # its own VLC, streaming over https with its own certificate list.
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            desktop: >-
              apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q
              --no-install-recommends ca-certificates libgl1 libegl1 libx11-6 libx11-xcb1 libxcb1
              libfontconfig1 libfreetype6 libharfbuzz0b libasound2t64 libexpat1 libgpg-error0
              libuuid1 zlib1g libdrm2 libgbm1 libwayland-client0 libfribidi0 libgmp10 libdbus-1-3
          - image: debian:12
            desktop: >-
              apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q
              --no-install-recommends ca-certificates libgl1 libegl1 libx11-6 libx11-xcb1 libxcb1
              libfontconfig1 libfreetype6 libharfbuzz0b libasound2 libexpat1 libgpg-error0
              libuuid1 zlib1g libdrm2 libgbm1 libwayland-client0 libfribidi0 libgmp10 libdbus-1-3
          - image: fedora:latest
            desktop: >-
              dnf install -y ca-certificates mesa-libGL mesa-libEGL libX11 libX11-xcb libxcb
              fontconfig freetype harfbuzz alsa-lib expat libgpg-error libuuid zlib-ng-compat
              libdrm mesa-libgbm libwayland-client fribidi gmp dbus-libs findutils tar gzip
          - image: archlinux:latest
            desktop: >-
              pacman -Syu --noconfirm --needed ca-certificates mesa libx11 libxcb fontconfig
              freetype2 harfbuzz alsa-lib expat libgpg-error util-linux-libs zlib libdrm wayland
              fribidi gmp dbus
          - image: opensuse/tumbleweed
            desktop: >-
              zypper --non-interactive install ca-certificates Mesa-libGL1 Mesa-libEGL1 libX11-6
              libX11-xcb1 libxcb1 fontconfig libfreetype6 libharfbuzz0 libasound2 libexpat1
              libgpg-error0 libuuid1 libz1 libdrm2 libgbm1 libwayland-client0 libfribidi0
              libgmp10 libdbus-1-3 findutils tar gzip gawk grep
    container: ${{ matrix.image }}
    steps:
      - name: A desktop's basic libraries (and no VLC)
        run: ${{ matrix.desktop }}
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: linux, path: artifacts }
      - name: No VLC on this computer
        shell: bash
        run: |
          ! command -v vlc
          ! ls /usr/lib*/libvlc.so* /usr/lib*/*/libvlc.so* 2>/dev/null
      - name: Nothing missing from the AppImage
        shell: bash
        run: |
          command -v ldd    # without it this check would find nothing and pass
          chmod +x artifacts/BLOODBOS-Radio-x86_64.AppImage
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/artifacts/BLOODBOS-Radio-x86_64.AppImage" --appimage-extract >/dev/null
          app="$RUNNER_TEMP/squashfs-root/usr/lib/bloodbos-radio"
          find "$app" -type f | while read -r f; do
            [ "$(head -c4 "$f" | tr -d '\0' | tail -c3)" = "ELF" ] || continue
            LD_LIBRARY_PATH="$app/_internal:$app/vlc" ldd "$f" 2>/dev/null | awk '/not found/ {print $1}'
          done | sort -u > missing.txt
          grep -v '^#' "$GITHUB_WORKSPACE/packaging/linux/appimage-excludelist.txt" > expected.txt
          cat "$app/appimage-optional-missing.txt" >> expected.txt
          grep -vxF -f expected.txt missing.txt > unexpected.txt || true
          echo "from this computer: $(grep -cxF -f expected.txt missing.txt || true) libraries it doesn't have"
          if [ -s unexpected.txt ]; then echo "The AppImage is missing:"; cat unexpected.txt; exit 1; fi
      - name: Self-test the AppImage
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          BLOODBOS_VLC_ARGS: --aout=dummy
          BLOODBOS_SELFTEST_MEDIA: >-
            https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tests/media/sample.mp4
            https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tests/media/sample.webm
        run: |
          artifacts/BLOODBOS-Radio-x86_64.AppImage --selftest | tee selftest.log
          grep -q "(bundled)" selftest.log

  release:
    needs: [windows, linux, macos, linux_installer, appimage]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.windows.result == 'success' && needs.linux.result == 'success' &&
      needs.macos.result == 'success' && needs.appimage.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh artifacts/install.sh
          files=$(find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.tar.gz' \
                  -o -name '*.AppImage' -o -name 'install.sh' \) | sort)
          echo "$files"
          title="BLOODBOS Radio ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
            body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
            if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file packaging/release-notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" $files --title "$title" --notes-file packaging/release-notes.md
          fi

  test_build:
    # The newest code on main as downloads: the "Test build" pre-release (tag
    # `testing`). GitHub never counts a pre-release as the latest release, so
    # the README's download links, install.sh and the app's update check all
    # stay on the real release.
    needs: [windows, linux, macos, linux_installer, appimage]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.windows.result == 'success' && needs.linux.result == 'success' &&
      needs.macos.result == 'success' && needs.linux_installer.result == 'success' &&
      needs.appimage.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Publish the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh artifacts/install.sh
          mapfile -t files < <(find artifacts -type f \( -name '*.exe' -o -name '*.dmg' \
              -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.AppImage' -o -name 'install.sh' \) | sort)
          printf '%s\n' "${files[@]}"
          v=$(python3 -c "import sys; sys.path.insert(0,'src'); from version import __version__; print(__version__)")
          short="${GITHUB_SHA::7}"
          title="Test build: $v ($short)"
          repo="https://github.com/$GITHUB_REPOSITORY"
          {
            echo "**Not an official release.** The newest code, built $(date -u '+%b %-d, %H:%M') UTC from [\`$short\`]($repo/commit/$GITHUB_SHA) — for trying changes before they're released. This page is replaced by every change."
            echo
            echo "The official version is always at [Releases → Latest]($repo/releases/latest)."
            echo
            echo "| Your computer | File |"
            echo "|---|---|"
            echo "| Windows 10 / 11 | **BLOODBOS-Radio-Setup-Windows.exe** |"
            echo "| Mac with an Apple chip | **BLOODBOS-Radio-macOS-AppleSilicon.dmg** |"
            echo "| Mac with an Intel chip | **BLOODBOS-Radio-macOS-Intel.dmg** |"
            echo "| Linux (any), no terminal | **BLOODBOS-Radio-x86_64.AppImage** — right-click → Properties → allow running it as a program, then double-click |"
            echo "| Ubuntu / Debian / Mint / Pop!_OS | **bloodbos-radio_amd64.deb** |"
            echo "| Linux (any) | in a terminal: \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh \| bash -s -- --testing\` |"
            echo
            echo "Back to the official version any time: install it from Releases → Latest (Linux: the same line without \`--testing\`)."
          } > notes.md
          # Same page, new files: move the tag and swap the downloads. Publishing
          # a new release each time would email everyone watching the repo on
          # every change. If GitHub won't let this token move the tag (it can
          # refuse when workflow files changed), start the page over instead.
          if gh release view testing >/dev/null 2>&1 &&
             gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/testing" \
               -f sha="$GITHUB_SHA" -F force=true >/dev/null; then
            gh release upload testing "${files[@]}" --clobber
            keep=$(printf '%s\n' "${files[@]}" | xargs -n1 basename)
            gh release view testing --json assets --jq '.assets[].name' | while read -r a; do
              grep -qxF "$a" <<<"$keep" || gh release delete-asset testing "$a" --yes
            done
            gh release edit testing --title "$title" --notes-file notes.md --prerelease
          else
            gh release delete testing --cleanup-tag --yes >/dev/null 2>&1 || true
            gh release create testing "${files[@]}" --prerelease --target "$GITHUB_SHA" \
              --title "$title" --notes-file notes.md
          fi
